<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780">
  <rect x="0" y="0" width="1100" height="780" fill="#FFFFFF" />
  <text x="550" y="40" font-family="sans-serif" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">HyperLogLog-rs: Three-Representation Ladder (Precision12, Bits6)</text>
  <text x="550" y="60" font-family="sans-serif" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">2^12 = 4096 registers  |  exact-values -&gt; hash-list at cardinality ~8150  |  hash-list -&gt; dense at ~8367</text>
  <rect x="40" y="100" width="220" height="100" fill="#4E8098" stroke="#2A5F7A" stroke-width="2" rx="6" />
  <text x="150" y="118" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Exact-values mode</text>
  <text x="48" y="136" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Sorted, gap-coded, gamma-packed values</text>
  <text x="48" y="153" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Active for cardinality 0 .. 8150</text>
  <text x="48" y="170" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Zero estimation error; exact set ops</text>
  <text x="48" y="187" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">(requires 'exact' feature + alloc)</text>
  <rect x="40" y="300" width="220" height="83" fill="#90C2E7" stroke="#2A5F7A" stroke-width="2" rx="6" />
  <text x="150" y="318" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Hash-list mode</text>
  <text x="48" y="336" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Sorted gap-coded composite hashes</text>
  <text x="48" y="353" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Active for cardinality ~8150 .. 8367</text>
  <text x="48" y="370" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Near-exact: MRE &lt; 0.65%  (union &lt; 1.3%)</text>
  <rect x="40" y="500" width="220" height="83" fill="#C4EAE1" stroke="#2A5F7A" stroke-width="2" rx="6" />
  <text x="150" y="518" font-family="sans-serif" font-size="13" fill="#111" text-anchor="middle" font-weight="bold">Dense registers (HyperLogLog)</text>
  <text x="48" y="536" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Classic HLL register array (4096 x 6 bits)</text>
  <text x="48" y="553" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Active for cardinality 8367+</text>
  <text x="48" y="570" font-family="sans-serif" font-size="10" fill="#222" text-anchor="start" font-weight="normal">Default MRE ~1-1.5%;  MLE union MRE ~1%</text>
