[workspace]
resolver = "2"
members = [".", "hyperloglog-derive", "optimal-gap-codes", "test_utils", "hash_list_correction"]
# The memory-comparison tooling was built on the `mem_dbg` crate, which has been dropped. These
# members are detached from the build until that tooling is rebuilt; their source is retained.
exclude = ["measure_variant", "statistical_comparisons", "statistical_comparisons/macro_test_utils"]

[package]
name = "hyperloglog-rs"
version = "0.1.56"
edition = "2021"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
description = "A Rust implementation of HyperLogLog trying to be parsimonious with memory."
homepage = "https://github.com/LucaCappelletti94/hyperloglog-rs"
repository = "https://github.com/LucaCappelletti94/hyperloglog-rs"
readme = "README.md"
license = "MIT"
keywords = ["hyperloglog", "probabilistic", "algorithm", "cardinality", "estimation",]
categories = [
    "no-std",
    "algorithms",
    "science"
]
exclude = [
    "fuzz/",
    "intersection_tests/",
    "union_test",
    "experiments",
    "intersection_benchmarks.tsv.gz"
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
paste = "1.0.15"
twox-hash = {version="1.6.3", default-features = false}
hyperloglog-derive = { path = "hyperloglog-derive" }
num-traits = { version = "0.2", default-features = false, features = ["libm"], optional = true }


[dev-dependencies]
serde_json = "1.0"
wyhash = "0.5.0"
ahash = "0.8.11"
color-backtrace = { version = "0.6" }
ctor = "0.2.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[features]
default = ["alloc"]
# The crate is always `no_std`. The MLE uses `alloc::collections::BTreeMap` and routes float
# transcendentals through `libm` (via `num-traits`).
mle = ["alloc", "dep:num-traits"]
alloc = []

[package.metadata.clippy]
all-features = true

[profile.test]
overflow-checks = true   # Disable integer overflow checks.
debug = true            # Include debug info.
debug-assertions = true  # Enables debug assertions.
opt-level = 3

[profile.release]
overflow-checks = false   # Disable integer overflow checks.
debug = false            # Include debug info.
debug-assertions = false  # Enables debug assertions.
opt-level = 3

[[bench]]
name = "hash_list_insert"
harness = false

[[bench]]
name = "hyperloglog_insert"
harness = false

[[bench]]
name = "hyperloglog_union"
harness = false

