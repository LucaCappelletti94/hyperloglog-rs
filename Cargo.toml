[workspace]
resolver = "2"
members = [".", "hyperloglog-derive", "test_utils", "correction_coefficients"]

[package]
name = "hyperloglog-rs"
version = "0.1.56"
edition = "2021"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
description = "A Rust implementation of HyperLogLog trying to be parsimonious with memory."
homepage = "https://github.com/LucaCappelletti94/hyperloglog-rs"
repository = "https://github.com/LucaCappelletti94/hyperloglog-rs"
readme = "README.md"
license = "MIT"
keywords = [
  "hyperloglog",
  "probabilistic",
  "algorithm",
  "cardinality",
  "estimation",
]
categories = ["no-std", "algorithms", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", default-features = false, features = [
  "derive",
], optional = true }
paste = "1.0.15"
twox-hash = { version = "1.6.3", default-features = false }
hyperloglog-derive = { path = "hyperloglog-derive" }


[dev-dependencies]
serde_json = "1.0"
# Memory-matched MinHash baseline for the regime-benchmark consistency check (insert and Jaccard).
minhash-rs = { git = "https://github.com/LucaCappelletti94/minhash-rs" }
wyhash = "0.5.0"
ahash = "0.8.11"
color-backtrace = { version = "0.6" }
ctor = "0.2.8"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
rayon = "1.10"

[features]
default = ["alloc"]
# The crate is always `no_std`. Maximum Likelihood Estimation is always available and fully
# allocation-free: it routes float transcendentals through the crate's own no_std `FloatOps` (no
# `num-traits`/`libm`), its scalar and register estimators use stack histograms, and the exact
# value-list joint decomposition is a sorted multi-way merge (no map). The `alloc` feature only
# enables the heap-`Vec`-backed register storage (`VecHll`); the fixed-size array backing needs no
# allocation.
alloc = []

[package.metadata.clippy]
all-features = true

[profile.test]
overflow-checks = true  # Disable integer overflow checks.
debug = true            # Include debug info.
debug-assertions = true # Enables debug assertions.
opt-level = 3

[profile.release]
overflow-checks = false  # Disable integer overflow checks.
debug = false            # Include debug info.
debug-assertions = false # Enables debug assertions.
opt-level = 3

[[bench]]
name = "hash_list_insert"
harness = false

[[bench]]
name = "hyperloglog_insert"
harness = false

[[bench]]
name = "hyperloglog_union"
harness = false

[[bench]]
name = "mle"
harness = false

[[bench]]
name = "correction"
harness = false

[[bench]]
name = "joint_mle"
harness = false
